name: Calibrate Work-first recording

on:
  push:
    branches:
      - newwork/work-first-launch-recording
    paths:
      - .github/workflows/calibrate-work-first-recording.yml

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix svelte-frontend ci --ignore-scripts --no-audit --no-fund
      - name: Resolve hosted Chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          echo "CHROME_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Route Work to Review through Tools for calibration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/calibrate-work-first-recording.mjs')
          source = path.read_text()
          old = """  await page.locator('[data-webmcp-receipt=\"work\"]').waitFor({ state: 'visible' });
            await pressUntil(page, 'Shift+Tab', 'work-review-in-queue', (focus) => focus?.href.startsWith('/review?focus=') && focus.visibleText === 'Review in queue');
            await page.keyboard.press('Enter');
            await waitForRoute(page, '/review');
          """.replace('            ', '  ')
          new = """  await page.locator('[data-webmcp-receipt=\"work\"]').waitFor({ state: 'visible' });
            await pressUntil(page, 'Shift+Tab', 'work-header-tools', (focus) => focus?.data.tools === true);
            await page.keyboard.press('Enter');
            await page.getByRole('dialog', { name: 'Tools' }).waitFor({ state: 'visible' });
            await pressUntil(page, 'Tab', 'tools-review', (focus) => focus?.href === '/review');
            await page.keyboard.press('Enter');
            await waitForRoute(page, '/review');
          """.replace('            ', '  ')
          if old not in source:
              raise SystemExit('Work-to-Review calibration block not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Measure application-only Work-first focus order
        run: node scripts/calibrate-work-first-recording.mjs
