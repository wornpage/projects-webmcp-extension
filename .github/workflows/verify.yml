name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix svelte-frontend ci --ignore-scripts
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm run verify
      - run: npm run test:browser
        env:
          CHROME_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
