name: Export Work-first branch source

on:
  push:
    branches:
      - newwork/work-first-launch-recording
    paths:
      - .github/workflows/export-work-first-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work-first-source
          path: .
          include-hidden-files: true
          retention-days: 1
