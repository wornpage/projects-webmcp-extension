name: Apply Work-first navigation

on:
  push:
    branches:
      - newwork/work-first-navigation
    paths:
      - .github/workflows/apply-work-first-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - name: Make regex replacements literal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-work-first-navigation.py')
          source = path.read_text(encoding='utf-8')
          before = 'updated, count = re.subn(pattern, replacement, source, count=1, flags=re.S)'
          after = 'updated, count = re.subn(pattern, lambda _match: replacement, source, count=1, flags=re.S)'
          if source.count(before) != 1:
              raise SystemExit('regex replacement helper was not found exactly once')
          path.write_text(source.replace(before, after, 1), encoding='utf-8')
          PY
      - name: Apply deterministic source transforms
        run: python3 scripts/apply-work-first-navigation.py
      - name: Commit transformed sources
        run: |
          git config user.name wornpage
          git config user.email 170748436+wornpage@users.noreply.github.com
          git add README.md scripts/webmcp-header-responsive-smoke.mjs svelte-frontend/src/routes/+layout.svelte tests/challenge-webmcp-page-contract.test.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Make Work the primary application navigation"
          git push origin HEAD:${{ github.ref_name }}
